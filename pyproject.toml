[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bhoot"
dynamic = ["version"]
description = "Verified, grounded structured extraction for lending documents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Satyam", email = "satyam83soni@gmail.com" }]
keywords = ["document-extraction", "llm", "structured-output", "ocr", "lending", "bank-statement"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "structlog>=24.1",
    "typer>=0.16",
    "rich>=13.7",
]

[project.optional-dependencies]
# LLM providers: install the one(s) named by `provider:` in bhoot.yaml.
# `openai` also covers Azure OpenAI and OpenAI-compatible servers (vLLM, Ollama).
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.30"]
ocr = ["rapidocr>=2.0", "onnxruntime>=1.18", "opencv-python-headless>=4.10"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
eval = ["pandas>=2.2"]
all = ["bhoot[openai,anthropic,gemini,ocr,otel,eval]"]

[project.scripts]
bhoot = "bhoot.cli.main:app"

# Built-in packs are registered here as they are implemented, e.g.:
# [project.entry-points."bhoot.packs"]
# "lending.bank_statement" = "bhoot.packs.lending.bank_statement:PACK"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "pip-licenses>=5.0",
    "pre-commit>=3.8",
    "types-PyYAML",
    "types-python-dateutil",
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=1.30",
]
tools = [
    "reportlab>=4.2",
    "faker>=28.0",
    "numpy>=1.26",
]

[tool.hatch.version]
path = "src/bhoot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bhoot"]

[tool.hatch.build.targets.sdist]
include = ["src/bhoot", "README.md"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "ASYNC", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bhoot"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["bhoot"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bhoot.domain.*", "bhoot.ports.*", "bhoot.engine.*"]
strict = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pdfplumber.*", "rapidocr.*", "cv2.*", "onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "live: calls real LLM providers (needs API keys, not run in CI)",
    "ocr: needs the bhoot[ocr] extra installed",
]

[tool.coverage.run]
source = ["bhoot"]
branch = true
