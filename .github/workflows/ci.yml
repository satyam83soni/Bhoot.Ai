name: CI

on:
  push:
    branches: [dev, uat, prod]
  pull_request:
    branches: [dev, uat, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --extra ocr
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Architecture layers
        run: uv run lint-imports
      - name: Licence check (no GPL/AGPL/LGPL dependencies)
        run: >
          uv run pip-licenses --partial-match
          --fail-on="GNU General Public License;GNU Affero General Public License;GNU Lesser General Public License;AGPL;LGPL;GPL"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}  # every uv command uses the matrix version, not .python-version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --group tools --extra ocr
      - name: Show interpreter under test
        run: uv run --no-sync python --version
      - run: uv run --no-sync pytest -m "not live" --cov --cov-report=term-missing

  # bhoot is a library: users bring their own versions of pydantic, the provider SDKs and the
  # rest. Prove the whole declared range works, not just what uv.lock happens to pin.
  deps:
    name: deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            python: "3.11"
            sync: --resolution lowest-direct
          - name: newest
            python: "3.13"
            sync: --upgrade
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync ${{ matrix.sync }} --group dev --group tools --extra ocr
      - name: Show resolved versions
        run: uv pip list
      - run: uv run --no-sync pytest -m "not live" -q
